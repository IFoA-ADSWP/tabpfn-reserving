[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabpfn-reserving"
version = "0.1.0"
description = "Loss reserving as a prediction problem: a reserve with its full predictive distribution, from a single forward pass."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    # The two that determine the science are pinned hard; the rest are lower bounds so the package still
    # installs across platforms. The exact environment that produced results/ is in requirements.txt.
    # TabPFN-3.5: the 9.0.0 release (2026-09-15) ships the 3.5 family.
    "tabpfn==9.0.0",
    # The baseline side: the Casualty Actuarial Society's own package, and the CAS Loss Reserve
    # Database that ships inside it.
    "chainladder==0.10.1",
    "pandas>=2.3",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.scripts]
tabpfn-reserving = "tabpfn_reserving.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Run the tests against *this* checkout's `src`. The venv lives only in the primary checkout and its editable
# install points there, so without this a `pytest` run inside a worktree imports the other tree's code -- the
# same failure the scripts' own sys.path bootstraps exist to prevent. Here it silently certifies a diff that
# was never imported.
pythonpath = ["src"]
